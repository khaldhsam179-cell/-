<section class="purchase-grid">
    <button onclick="openPayment('نسخة VIP', '120ج')" class="btn btn-vip">شراء نسخة VIP (120ج)</button>
    <button onclick="openPayment('النسخة العادية', '50ج')" class="btn btn-normal">شراء النسخة العادية (50ج)</button>
</section>

<section class="shipping-section">
    <h3>قسم الشحن السريع</h3>
    <div class="shipping-grid">
        <button onclick="openPayment('شحن نسخة (الـ 100 بـ 10ج)', 'حسب الكمية')" class="btn-s">شحن رصيد</button>
        <button onclick="openPayment('فتح حساب في كل النسخ', '20ج')" class="btn btn-open">فتح حساب شامل (20ج)</button>
    </div>
</section>

<div id="payModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="itemTitle" style="color: #ffd700;"></h2>
        <p id="itemPrice" style="margin-bottom: 15px;"></p>
        
        <div class="pay-box">
            <p>الرجاء تحويل المبلغ إلى حساب ماي كاش:</p>
            <h1 style="color: #00ff00; letter-spacing: 2px;">300159768</h1>
        </div>

        <div class="input-area">
            <label>أدخل رقم حسابك:</label>
            <input type="text" id="accNum" placeholder="01xxxxxxxxx">
            
            <label style="margin-top: 10px; display: block;">ارفع صورة الإشعار:</label>
            <input type="file" id="fileUp" style="font-size: 12px;">
        </div>

        <button onclick="confirmOrder()" class="btn-confirm">تأكيد الشحن</button>
    </div>
</div>
